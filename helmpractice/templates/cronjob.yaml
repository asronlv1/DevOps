apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "helmpractice.fullname" . }}-cron
spec:
  schedule: {{ .Values.cronJob.schedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cron
              image: "{{ .Values.cronJob.image.repository }}:{{ .Values.cronJob.image.tag }}"
              command:
{{- range .Values.cronJob.command }}
                - {{ . | quote }}
{{- end }}

